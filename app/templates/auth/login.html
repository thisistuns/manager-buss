{% extends "base.html" %}

{% block title %}Đăng nhập - Hệ thống Quản lý GPT Team{% endblock %}

{% block auth_content %}
<div class="login-container">
    <div class="login-box">
        <h2>Đăng nhập Quản trị</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Nhập mật khẩu quản trị"
                    required
                    autocomplete="current-password"
                >
            </div>
            <div id="errorMessage" class="error-message" style="display: none;"></div>
            <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function handleLogin(event) {
    event.preventDefault();

    const password = document.getElementById('password').value;
    const errorMessage = document.getElementById('errorMessage');
    const submitButton = event.target.querySelector('button[type="submit"]');

    // Vô hiệu hóa nút submit
    submitButton.disabled = true;
    submitButton.textContent = 'Đang đăng nhập...';
    errorMessage.style.display = 'none';

    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
            // Đăng nhập thành công, chuyển đến bảng điều khiển
            window.location.href = '/admin';
        } else {
            // Hiển thị thông báo lỗi
            errorMessage.textContent = data.error || 'Đăng nhập thất bại';
            errorMessage.style.display = 'block';
            submitButton.disabled = false;
            submitButton.textContent = 'Đăng nhập';
        }
    } catch (error) {
        errorMessage.textContent = 'Lỗi kết nối, vui lòng thử lại';
        errorMessage.style.display = 'block';
        submitButton.disabled = false;
        submitButton.textContent = 'Đăng nhập';
    }
}
</script>
{% endblock %}
